name: Stats

# Gera os cards de estatisticas do perfil e commita os SVGs no proprio
# repositorio. O README aponta para caminho relativo, entao nao depende de
# nenhum servico externo em tempo de execucao.

on:
  schedule:
    # 06:00 UTC = 03:00 BRT, diariamente.
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/generate-stats.mjs
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    name: Gerar e commitar os cards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar os SVGs
        env:
          # STATS_TOKEN e opcional: so e necessario se o GITHUB_TOKEN nativo nao
          # tiver acesso ao contributionsCollection. Basta escopo read:user.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/generate-stats.mjs

      - name: Commitar se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/stats.pt-BR.svg
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca nas estatisticas."
            exit 0
          fi
          git commit -m "chore: atualiza os cards de estatisticas"
          # Dois runs podem se sobrepor (agendado e push, por exemplo) e deixar
          # este checkout para tras. Rebase e tenta de novo antes de desistir.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejeitado. Rebase na main e nova tentativa ($i/3)."
            git pull --rebase origin main
          done
          echo "Push falhou apos 3 tentativas."
          exit 1
